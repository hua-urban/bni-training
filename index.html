<style>
  :root {
    --bg: #0e0d0b;
    --paper: #1c1a14;
    --ink: #ede6d3;
    --ink-dim: #9a917a;
    --gold: #c9a961;
    --gold-bright: #e8c97a;
    --gold-deep: #8a7440;
    --crimson: #b04a3a;
    --green: #7fae6a;
    --line: #2a261c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 300;
    line-height: 1.7;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 20px 100px;
  }

  header { text-align: center; margin-bottom: 32px; }

  .eyebrow {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--gold);
    font-size: 16px;
    letter-spacing: 0.12em;
    margin-bottom: 14px;
  }

  h1 {
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: clamp(26px, 6vw, 34px);
    line-height: 1.3;
    background: linear-gradient(180deg, var(--ink) 0%, var(--gold-bright) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .notice {
    background: var(--paper);
    border: 1px solid var(--gold-deep);
    border-left: 3px solid var(--gold);
    padding: 18px 20px;
    margin-bottom: 28px;
    font-size: 13.5px;
    color: var(--ink-dim);
    line-height: 1.8;
  }

  .notice strong { color: var(--gold-bright); font-weight: 500; }

  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 28px 24px;
    margin-bottom: 20px;
  }

  .field-label {
    font-family: 'Noto Serif TC', serif;
    color: var(--gold);
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.04em;
    margin-bottom: 12px;
    display: block;
  }

  select#nameSelect {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--gold-deep);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 17px;
    padding: 12px 14px;
    outline: none;
  }

  select#nameSelect:focus { border-color: var(--gold-bright); }

  #statusHint {
    margin-top: 12px;
    font-size: 12.5px;
    color: var(--ink-dim);
    min-height: 18px;
  }

  #courseCard { display: none; }
  #courseCard.visible { display: block; }

  .course-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 4px;
    border-bottom: 1px dashed var(--line);
    cursor: pointer;
  }

  .course-item:last-of-type { border-bottom: none; }

  .course-item input[type="checkbox"] {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    accent-color: var(--gold);
    cursor: pointer;
  }

  .course-item input[type="checkbox"]:disabled {
    cursor: not-allowed;
    opacity: 0.75;
  }

  .course-item input[type="checkbox"]:disabled + label {
    cursor: default;
  }

  .locked-banner {
    display: none;
    background: rgba(127, 174, 106, 0.12);
    border: 1px solid var(--green);
    color: var(--green);
    font-size: 13.5px;
    padding: 12px 14px;
    margin-bottom: 18px;
    line-height: 1.6;
  }

  .edit-btn {
    display: none;
    width: 100%;
    background: transparent;
    border: 1px solid var(--gold-deep);
    color: var(--gold-bright);
    padding: 14px;
    font-family: 'Noto Serif TC', serif;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.08em;
    cursor: pointer;
    margin-bottom: 12px;
    transition: all 0.25s;
  }

  .edit-btn:hover {
    border-color: var(--gold-bright);
    color: var(--gold-bright);
    background: rgba(201, 169, 97, 0.08);
  }

  .course-item label {
    font-family: 'Noto Serif TC', serif;
    font-size: 16px;
    color: var(--ink);
    cursor: pointer;
    flex: 1;
  }

  textarea#noteInput {
    width: 100%;
    margin-top: 20px;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    padding: 12px 14px;
    min-height: 72px;
    resize: vertical;
    outline: none;
  }

  textarea#noteInput:focus { border-color: var(--gold-deep); }

  .submit-section { text-align: center; margin-top: 8px; }

  .submit-btn {
    width: 100%;
    background: var(--gold);
    color: var(--bg);
    border: none;
    padding: 16px;
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.25s;
  }

  .submit-btn:hover { background: var(--gold-bright); }

  .submit-btn:disabled {
    background: var(--line);
    color: var(--ink-dim);
    cursor: not-allowed;
  }

  .status-msg {
    margin-top: 16px;
    font-size: 14px;
    color: var(--ink-dim);
    min-height: 20px;
  }

  .status-msg.success { color: var(--green); }
  .status-msg.error { color: #d96a58; }

  @media (max-width: 500px) {
    .container { padding: 32px 16px 80px; }
    .card { padding: 22px 18px; }
  }
</style>

<script>
/* ============================================================
   ⬇⬇⬇  只有這一行需要你動！  ⬇⬇⬇
   把下面引號中的內容，換成你的 Google Apps Script 網頁應用程式網址
   （教學文件 STEP 2 會教你怎麼拿到這串網址，長得像
    https://script.google.com/macros/s/AKfycb..../exec ）
   ============================================================ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwH2PRrkEtuAsr0SPxu8DzA-xlBhjhMN3rYaaz2oNvC5nYpfuvf64hscHfwC6k1P9QuPg/exec";
/* ============================================================
   ⬆⬆⬆  只有這一行需要你動！  ⬆⬆⬆
   ============================================================ */

// 5 堂課固定順序，跟 Code.gs 的 COURSE_KEYS 完全對齊，不要單獨調整順序。
const COURSES = [
  { key: 'msp', label: 'MSP' },
  { key: 'oneOnOne', label: '一對一工作坊' },
  { key: 'pt', label: 'PT工作坊' },
  { key: 'referral', label: '引薦工作坊' },
  { key: 'presentation', label: '簡報工作坊' }
];

// 內嵌 seed（跟 Code.gs 的 ROSTER 同一份資料）：
// 用途 1／部署前預覽 UI（未接 GAS 也能選名字看到預勾狀態）
// 用途 2／GAS 還沒回應前的樂觀顯示，不用等網路
// 正式部署後，實際狀態一律以 GAS 回傳的「目前狀態」為準（見 fetchStatus）。
const ROSTER_SEED = {
  '王常殷': [true, true, false, false, false],
  '藍堂嘉': [false, true, false, false, false],
  '劉羿岑': [true, true, false, false, false],
  '陳向柔': [true, false, false, false, false],
  '劉恩秀': [false, true, false, false, false],
  '周以仁': [true, true, false, false, false],
  '張瓊安': [true, true, true, true, false],
  '高翊書': [true, true, false, false, false],
  '王寶佳': [true, true, true, true, false],
  '王春雄': [true, true, true, true, false],
  '陳靖薇': [true, true, false, false, false],
  '蘇瓜雅': [true, true, false, false, false],
  '施宜妏': [true, false, false, false, false],
  '莊大永': [true, true, false, false, false],
  '莊涵勝': [true, true, false, false, false],
  '黃冠霖': [true, false, false, false, false],
  '諸紀平': [true, true, false, false, false],
  '陳秒螢': [false, false, false, false, false],
  '李艾莉': [true, true, false, false, false],
  '吳翊辰': [true, false, true, false, false],
  '黃郁婷': [true, false, false, false, false],
  '林必涵': [false, true, true, false, false],
  '蔡明璋': [true, true, true, true, false],
  '王佳筠': [true, true, false, false, false],
  '楊之慧': [true, true, false, false, false],
  '陳黎玲': [true, false, true, false, false],
  '林佩君': [true, false, false, false, false],
  '林媜媁': [true, true, false, false, false],
  '李慧如': [false, false, false, false, false],
  '凃馨文': [true, true, false, false, false],
  '柳慧燕': [true, false, true, false, false],
  '宋馨巧': [false, true, false, false, false],
  '張瑜晏': [false, false, false, false, false],
  '陳昭男': [false, false, false, false, false],
  '包育翎': [true, true, false, false, false],
  '蔡岱達': [true, true, true, false, true],
  '蔡淯思': [true, false, false, false, false],
  '詹媛婷': [true, true, true, false, false],
  '王雅慧': [true, false, false, false, false],
  '何俊彥': [true, true, false, false, false],
  '周育慈': [true, true, false, false, false],
  '洪嘉璿左左': [false, false, false, false, false],
  '鍾智媛': [true, false, false, false, false],
  '林中群': [true, false, false, false, false],
  '蔡馨葳': [true, true, false, false, false],
  '林晏伃': [true, false, false, false, false],
  '李瑞雲': [true, true, false, false, false],
  '謝夢瑰': [true, true, false, false, false],
  '張怡蘋': [true, true, true, false, false],
  '張耕豪': [true, true, false, false, false],
  '陳品攸': [true, true, false, false, false],
  '吳念鎧': [true, false, false, false, false],
  '沈瑞婷': [false, false, false, false, false],
  '古育瑋': [false, false, false, false, false]
};

const NAMES = Object.keys(ROSTER_SEED);

const nameSelect = document.getElementById('nameSelect');
const statusHint = document.getElementById('statusHint');
const courseCard = document.getElementById('courseCard');
const courseList = document.getElementById('courseList');
const noteInput = document.getElementById('noteInput');
const submitBtn = document.getElementById('submitBtn');
const editBtn = document.getElementById('editBtn');
const lockedBanner = document.getElementById('lockedBanner');
const statusMsg = document.getElementById('statusMsg');

let currentName = '';

// 23 位有綽號的人：顯示文字要加「（綽號）」，key＝NAMES/ROSTER 裡原本的姓名字串。
// 這份名單以外的人不補綽號。
const NICKNAMES = {
  '王常殷': 'Hubert',
  '陳向柔': 'Naomi',
  '劉恩秀': 'Joan',
  '高翊書': 'Eason',
  '王寶佳': 'Renee',
  '王春雄': 'Jayson',
  '陳秒螢': 'Emma',
  '李艾莉': 'Aili',
  '陳黎玲': 'Jossie',
  '林媜媁': 'Wei',
  '李慧如': 'Eva',
  '凃馨文': 'Wen',
  '蔡淯思': 'Mina',
  '王雅慧': 'Peggy',
  '周育慈': 'Anna',
  '鍾智媛': 'Fiona',
  '蔡馨葳': 'Mandy',
  '李瑞雲': 'Grace',
  '謝夢瑰': 'Dian',
  '張怡蘋': 'April',
  '藍堂嘉': '小虎',
  '陳昭男': 'Johnny',
  '洪嘉璿左左': '左左'
};

// 特例：「洪嘉璿左左」這個 NAMES 字串本身是「本名＋綽號」黏在一起，
// 顯示要拆成「洪嘉璿（左左）」；value 仍用原字串（後端比對 key），不能動。
const DISPLAY_NAME_OVERRIDE = {
  '洪嘉璿左左': '洪嘉璿'
};

// 下拉選單塞 54 人名單，顯示文字加編號（1~54，依名冊順位）＋有綽號的人加（綽號），
// 但 option 的 value 一律保持乾淨姓名 —— 送後端 / 查詢都讀這個 value，不能帶編號或綽號。
NAMES.forEach((name, idx) => {
  const opt = document.createElement('option');
  opt.value = name;
  const displayName = DISPLAY_NAME_OVERRIDE[name] || name;
  const nickname = NICKNAMES[name];
  opt.textContent = (idx + 1) + '. ' + displayName + (nickname ? '（' + nickname + '）' : '');
  nameSelect.appendChild(opt);
});

function seedToCourses(seedArr) {
  const courses = {};
  COURSES.forEach((c, idx) => { courses[c.key] = !!seedArr[idx]; });
  return courses;
}

// disabled=true 時 5 個 checkbox 全部鎖住（載入中 / 已回報鎖定用）
function renderCourses(courses, disabled) {
  courseList.innerHTML = COURSES.map(c => `
    <div class="course-item" data-key="${c.key}">
      <input type="checkbox" id="course-${c.key}" ${courses[c.key] ? 'checked' : ''} ${disabled ? 'disabled' : ''}>
      <label for="course-${c.key}">${c.label}</label>
    </div>
  `).join('');
}

function setStatusHint(text) {
  statusHint.textContent = text;
}

// updatedAt（ISO 時間字串）轉成好讀的台灣時間，例：2026/07/10 14:30；null/無效值回傳空字串
function formatUpdatedAt(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleString('zh-TW', {
    timeZone: 'Asia/Taipei',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false
  });
}

// 切換名字的當下立刻呼叫：清空+鎖住 5 個 checkbox 與送出鈕，顯示「載入中」，
// 避免快速切換時使用者短暫看到上一個人殘留的勾選。
function showLoadingState() {
  const emptyCourses = {};
  COURSES.forEach(c => { emptyCourses[c.key] = false; });
  renderCourses(emptyCourses, true);
  noteInput.value = '';
  noteInput.disabled = true;
  lockedBanner.style.display = 'none';
  editBtn.style.display = 'none';
  submitBtn.style.display = 'block';
  submitBtn.disabled = true;
  statusMsg.textContent = '';
  setStatusHint('載入中...');
}

// fetch 回來後依 source 套用畫面：
//   submitted（已回報過）→ 鎖定唯讀 + 顯示「要修改」按鈕
//   seed（沒送過） → 正常可編輯表單
function applyStatus(status) {
  const locked = status.source === 'submitted';
  renderCourses(status.courses, locked);
  noteInput.value = status.note || '';
  noteInput.disabled = locked;

  if (locked) {
    const t = formatUpdatedAt(status.updatedAt);
    lockedBanner.textContent = '✅ 你已在' + (t ? ' ' + t + ' ' : '') + '回報過，目前紀錄如下：';
    lockedBanner.style.display = 'block';
    editBtn.style.display = 'block';
    submitBtn.style.display = 'none';
  } else {
    lockedBanner.style.display = 'none';
    editBtn.style.display = 'none';
    submitBtn.style.display = 'block';
    submitBtn.disabled = false;
  }

  if (status.hint) {
    setStatusHint(status.hint);
  } else if (locked) {
    setStatusHint('紀錄有誤請按下方「要修改」重新編輯。');
  } else {
    setStatusHint('目前顯示：總部原始記錄，尚未有你送出過的紀錄。');
  }
}

editBtn.addEventListener('click', () => {
  document.querySelectorAll('#courseList input[type="checkbox"]').forEach(cb => { cb.disabled = false; });
  noteInput.disabled = false;
  lockedBanner.style.display = 'none';
  editBtn.style.display = 'none';
  submitBtn.style.display = 'block';
  submitBtn.disabled = false;
  setStatusHint('已解鎖，修改完畢後記得按「送出 / 更新」。');
});

// 破快取：fetch GAS 時帶時間戳 query + no-store，避免拿到舊回應
async function fetchStatus(name) {
  if (!SCRIPT_URL || SCRIPT_URL.indexOf('PASTE_YOUR') !== -1) {
    // 尚未部署 / 未貼網址 → 純預覽模式，直接用內嵌 seed
    return {
      source: 'seed',
      courses: seedToCourses(ROSTER_SEED[name] || [false, false, false, false, false]),
      note: '',
      hint: '（預覽模式：尚未接上後端，顯示內建的總部原始記錄）'
    };
  }
  try {
    const url = SCRIPT_URL + '?name=' + encodeURIComponent(name) + '&t=' + Date.now();
    const res = await fetch(url, { method: 'GET', cache: 'no-store' });
    const data = await res.json();
    if (!data || !data.ok) throw new Error('bad response');
    return data;
  } catch (err) {
    console.error(err);
    return {
      source: 'seed',
      courses: seedToCourses(ROSTER_SEED[name] || [false, false, false, false, false]),
      note: '',
      hint: '（連不到後端，暫時顯示內建的總部原始記錄，送出前請確認勾選正確）'
    };
  }
}

// requestToken：防止「快速切換名字」時，前一個人還沒 fetch 完就被切走，
// 結果回來晚了反而覆蓋成上一個人的資料。每次切換都發新 token，
// fetch 回來時比對 token，對不上就丟棄（使用者已經切到別人了）。
let requestToken = 0;

nameSelect.addEventListener('change', async () => {
  const name = nameSelect.value;
  if (!name) return;
  currentName = name;
  const myToken = ++requestToken;

  // 立刻鎖住＋清空，絕不能短暫顯示上一個人的殘留勾選
  courseCard.classList.add('visible');
  showLoadingState();

  const status = await fetchStatus(name);
  if (myToken !== requestToken) return; // 使用者已經切到別人，這筆回應作廢

  applyStatus(status);
});

submitBtn.addEventListener('click', async () => {
  if (!currentName) return;

  if (!SCRIPT_URL || SCRIPT_URL.indexOf('PASTE_YOUR') !== -1) {
    statusMsg.textContent = '⚠️ 系統尚未設定完成（管理者：請貼上 Apps Script 網址）';
    statusMsg.className = 'status-msg error';
    return;
  }

  const courses = {};
  COURSES.forEach(c => {
    courses[c.key] = document.getElementById('course-' + c.key).checked;
  });

  const payload = {
    name: currentName,
    courses,
    note: noteInput.value.trim(),
    submittedAt: new Date().toISOString()
  };

  submitBtn.disabled = true;
  statusMsg.textContent = '送出中...';
  statusMsg.className = 'status-msg';

  try {
    // no-cors + text/plain：避開瀏覽器對 Apps Script 的 CORS 預檢，這是讓各種手機都能順利送出的關鍵寫法。
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });

    // no-cors 模式下無法讀取回應內容，只要 fetch 沒拋錯就視為送達。
    statusMsg.textContent = '✓ 已送出！感謝 ' + currentName + ' 更新培訓進度';
    statusMsg.className = 'status-msg success';

    // 樂觀鎖定：不用等重新 fetch，直接用剛送出的內容切換成「已回報」鎖定畫面
    applyStatus({ source: 'submitted', courses, note: payload.note, updatedAt: payload.submittedAt });
  } catch (err) {
    console.error(err);
    statusMsg.textContent = '送出失敗，請檢查網路後再按一次';
    statusMsg.className = 'status-msg error';
  } finally {
    submitBtn.disabled = false;
  }
});
</script>

</body>
